name: Release

# Packager release type (CurseForge), from BigWigs release.sh:
#   1) Untagged commits → alpha
#   2) Tagged: tag contains "alpha" → alpha; "beta" → beta; else → release
#
# Manual: Actions → Release → Run workflow
#   bump:          release | patch | hotfix   (version numbers)
#   release_type:  alpha | beta | release    (CurseForge file type)
#
# Flow (one CurseForge upload per release):
#   workflow_dispatch → bump TOCs, commit, push tag → then package
#   push v* tag (human) → package only
# Version shape: 10.0  (hotfix omitted) → 10.0.1 only when hotfix bumped
# First manual run (no v* tags yet): tags TOC as-is (e.g. 10.2), ignores bump
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        required: true
        default: patch
        options:
          - hotfix
          - patch
          - release
      release_type:
        description: CurseForge release type (alpha / beta / release)
        type: choice
        required: true
        default: alpha
        options:
          - release
          - beta
          - alpha

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Manual only: bump version, commit, push branch + tag (no packager).
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, update TOCs, push tag
        env:
          BUMP: ${{ inputs.bump }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Base version from latest v* tag, else TOC (strip v / -alpha / -beta).
          latest_tag="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          base="$(echo "$latest_tag" | sed 's/^v//' | sed -E 's/[-+].*$//' || true)"
          if [ -z "$base" ]; then
            base="$(grep -m1 '^## Version:' WhoaUnitFrames.toc | sed 's/^## Version:[[:space:]]*//' | sed -E 's/[-+].*$//')"
          fi
          if [ -z "$base" ]; then
            echo "Could not determine current version from tags or TOC"
            exit 1
          fi

          release="$(echo "$base" | awk -F. '{print $1+0}')"
          patch="$(echo "$base" | awk -F. '{print ($2 == "" ? 0 : $2+0)}')"
          hotfix="$(echo "$base" | awk -F. '{print ($3 == "" ? 0 : $3+0)}')"
          echo "Current version parts: release=$release patch=$patch hotfix=$hotfix"

          # First tag: keep TOC version (e.g. 10.2) — do not bump.
          if [ -z "$latest_tag" ]; then
            echo "No existing v* tags; using TOC version as first tag (no bump)"
          else
            case "$BUMP" in
              release) release=$((release + 1)); patch=0; hotfix=0 ;;
              patch)   patch=$((patch + 1)); hotfix=0 ;;
              hotfix)  hotfix=$((hotfix + 1)) ;;
              *) echo "Unknown bump: $BUMP"; exit 1 ;;
            esac
          fi

          # Omit .hotfix when 0 → 10.0 not 10.0.0
          if [ "$hotfix" -gt 0 ]; then
            ver="${release}.${patch}.${hotfix}"
          else
            ver="${release}.${patch}"
          fi

          # Packager: tag text controls CurseForge type (alpha/beta/release).
          case "$RELEASE_TYPE" in
            alpha) tag_ver="${ver}-alpha" ;;
            beta)  tag_ver="${ver}-beta" ;;
            release) tag_ver="$ver" ;;
            *) echo "Unknown release type: $RELEASE_TYPE"; exit 1 ;;
          esac

          tag="v${tag_ver}"
          echo "New version: $ver  tag: $tag  curse type: $RELEASE_TYPE"

          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag ${tag} already exists on remote; refuse to republish"
            exit 1
          fi

          for toc in WhoaUnitFrames.toc WhoaUnitFrames_*.toc; do
            [ -f "$toc" ] || continue
            sed -i -E "s/^## Version:.*/## Version: ${ver}/" "$toc"
          done

          git add WhoaUnitFrames.toc WhoaUnitFrames_*.toc
          if git diff --cached --quiet; then
            echo "TOC already at ${ver}; no version commit"
          else
            git commit -m "chore: bump version to ${ver}"
          fi
          git tag -a "$tag" -m "$tag"

          # Push tag before packager so the GitHub Release does not create it first.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "refs/tags/${tag}"

  # Package once: after a successful manual bump, or on a human-pushed v* tag.
  package:
    needs: bump
    if: |
      always() && !cancelled() && (
        (github.event_name == 'workflow_dispatch' && needs.bump.result == 'success') ||
        (github.event_name == 'push' && github.actor != 'github-actions[bot]')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
