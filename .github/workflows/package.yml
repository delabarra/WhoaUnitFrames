name: Package

# Tag push (v10.1, 10.1, ...)  -> pack every flavor + publish a GitHub release
# Manual run (Actions tab)     -> pack every flavor as downloadable artifacts
on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (blank = TOC ## Version)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  pack:
    name: Pack ${{ matrix.flavor }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Live clients only (no Wrath / Cata Classic).
        flavor: [All, Classic, Vanilla, TBC, Mists, Mainline]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          $v = "$env:INPUT_VERSION".Trim()
          if (-not $v -and $env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Pack ${{ matrix.flavor }}
        shell: pwsh
        run: ./tools/pack.ps1 -Flavor "${{ matrix.flavor }}" -Version "${{ steps.ver.outputs.version }}" -Strict

      - uses: actions/upload-artifact@v4
        with:
          name: WhoaUnitFrames-${{ matrix.flavor }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: pack
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
